# copilot-hive tui --config docs/config.example.toml

[[projects]]
name = "backend"
path = "/ruta/absoluta/al/proyecto"
# Grupo opcional. La barra de pestañas muestra solo el grupo actual (`{` / `}` cambian de
# grupo; Tab y Alt+1..9 actúan dentro del grupo). Orden de grupos = primera aparición.
# Los proyectos sin `group` forman un grupo aparte.
group = "Core"
# Aprobar todos los permisos de esta sesión desde el arranque (peligroso). Por defecto false.
allow_all = false
# Modelo de la sesión al arrancar (id tal como lo lista Copilot).
model = "claude-sonnet-4.5"

# Modelos obligatorios de subagentes. Se escriben en ~/.copilot/settings.json
# (subagents.agents.<nombre>, modelPolicy "required"): son GLOBALES del usuario,
# no solo de este proyecto; si dos proyectos chocan, gana el último.
[projects.agent_models]
explore = "claude-haiku-4.5"
code-review = "gpt-5.3-codex"
