[package]
name = "copilot-hive"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time", "sync"] }
toml = "1.2.2"
unicode-width = "0.2.3"
